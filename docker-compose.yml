services:
  db:
    image: timescale/timescaledb:2.22.1-pg16
    environment:
      POSTGRES_USER: p2v3
      POSTGRES_PASSWORD: p2v3
      POSTGRES_DB: p2v3
    ports:
      - "5433:5432"
    volumes:
      - p2v3-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2v3 -d p2v3"]
      interval: 2s
      timeout: 5s
      retries: 30
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

volumes:
  p2v3-pg:
